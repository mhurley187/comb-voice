name: Build disting NT plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get this repository
        uses: actions/checkout@v4

      - name: Get the disting NT API
        uses: actions/checkout@v4
        with:
          repository: expertsleepersltd/distingNT_API
          path: distingNT_API

      - name: Install the ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-g++ --version

      - name: Build
        run: make CXX=arm-none-eabi-g++ ARM_CXX=arm-none-eabi-g++ API=distingNT_API/include plugins/comb_voice.o

      - name: Check for unresolved symbols
        run: |
          echo "Undefined symbols the NT must provide:"
          arm-none-eabi-nm -u plugins/comb_voice.o || true
          echo "Anything other than NT_ API functions (and the normal _GLOBAL_OFFSET_TABLE_) is a problem:"
          if arm-none-eabi-nm -u plugins/comb_voice.o | grep -v ' NT_' | grep -v '_GLOBAL_OFFSET_TABLE_'; then
            echo "FAIL: the plugin depends on library functions the NT may not provide"
            exit 1
          fi
          echo "OK: only NT API symbols are referenced"
          arm-none-eabi-size plugins/comb_voice.o

      - name: Save the plugin
        uses: actions/upload-artifact@v4
        

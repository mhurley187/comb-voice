name: Build disting NT plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get this repository
        uses: actions/checkout@v4

      - name: Get the disting NT API
        uses: actions/checkout@v4
        with:
          repository: expertsleepersltd/distingNT_API
          path: distingNT_API

      - name: Install the ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-g++ --version

      - name: Show the API headers (helps debugging if the next step fails)
        run: find distingNT_API -name "*.h" | head -20

      - name: Build
        run: make API=distingNT_API/include plugins/comb_voice.o

      - name: Save the plugin
        uses: actions/upload-artifact@v4
        with:
          name: comb_voice
          path: plugins/comb_voice.o

name: Build disting NT plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get this repository
        uses: actions/checkout@v4

      - name: Get the disting NT API
        uses: actions/checkout@v4
        with:
          repository: expertsleepersltd/distingNT_API
          path: distingNT_API
          fetch-depth: 0

      - name: Use API version 13 (what firmware 1.15 to 1.16 supports)
        working-directory: distingNT_API
        run: |
          grep -n "kNT_apiVersionCurrent" include/distingnt/api.h
          if grep -q "kNT_apiVersion14" include/distingnt/api.h; then
            C=$(git log --format=%H -S'kNT_apiVersion14' -- include/distingnt/api.h | tail -1)
            echo "Header is newer than v13; using the commit just before $C"
            git checkout -q "$C^"
          fi
          echo "Building against:"
          git log -1 --format='%h %ad %s' --date=short
          grep -n "kNT_apiVersionCurrent" include/distingnt/api.h

      - name: Install the ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-g++ --version

      - name: Build
        run: make CXX=arm-none-eabi-g++ ARM_CXX=arm-none-eabi-g++ API=distingNT_API/include plugins/comb_voice.o plugins/phase_six.o

      - name: Check for unresolved symbols
        run: |
          for f in plugins/comb_voice.o plugins/phase_six.o; do
            echo "== $f: undefined symbols the NT must provide:"
            arm-none-eabi-nm -u $f || true
            if arm-none-eabi-nm -u $f | grep -v ' NT_' | grep -v '_GLOBAL_OFFSET_TABLE_'; then
              echo "FAIL: $f depends on library functions the NT may not provide"
              exit 1
            fi
            arm-none-eabi-size $f
          done
          echo "OK: only NT API symbols are referenced"

      - name: Save the plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: plugins/*.o
